<!DOCTYPE html>
<html lang="en" class="">

<head>
  <meta charset=" UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodingCamp</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="font-mono max-w-lg sm:max-w-3xl mx-auto px-6 py-12">
  <header class="flex flex-row flex-wrap justify-between gap-y-2 gap-x-4 sm:gap-0 py-4 border-inherit border-b-2">
    <h1 class="text-lg sm:text-xl font-semibold tracking-tight">Budget and Expense Visualizer</h1>
    <!--Theme Buttons-->
    <div class="flex flex-row outline outline-2 rounded-sm">
      <!--System Theme-->
      <button id="system-theme" class="bg-white p-1">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
          <path fill-rule="evenodd"
            d="M2.25 5.25a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3V15a3 3 0 0 1-3 3h-3v.257c0 .597.237 1.17.659 1.591l.621.622a.75.75 0 0 1-.53 1.28h-9a.75.75 0 0 1-.53-1.28l.621-.622a2.25 2.25 0 0 0 .659-1.59V18h-3a3 3 0 0 1-3-3V5.25Zm1.5 0v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5Z"
            clip-rule="evenodd" />
        </svg>
      </button>
      <!--Light Theme-->
      <button id="light-theme" class="bg-white p-1">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
          <path
            d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
        </svg>
      </button>
      <!--Dark Theme-->
      <button id="dark-theme" class="bg-white p-1">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
          <path fill-rule="evenodd"
            d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z"
            clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  </header>
  <main class="flex flex-col gap-y-4 py-4 font-semibold">
    <div class="pb-2 text-center">
      Balance:
      <br>
      <span id="balance" class="text-2xl">Rp.0.00</span>
    </div>
    <div class="flex flex-row items-center gap-x-4 max-w-2xl mx-auto px-4 ">
      <label for="budget-input">Budget:</label>
      <input id="budget-input" type="number" class="bg-inherit border-2 rounded-sm p-1" placeholder="Enter Budget">
      <button id="budget-button" class="p-1 rounded-sm outline outline-2 text-sm" type="button">
        Set Budget
      </button>
    </div>
    <span class="text-center text-red-500 invisible text-sm" id="budget-error" role="alert">Budget Error</span>
    <div class="outline outline-2 rounded-sm">
      <h2 class="p-2">Add Transactions</h2>
      <form id="transaction-form" class="flex flex-col gap-y-2 max-w-2xl mx-auto px-4 text-sm">
        <label for="name">Name:</label>
        <input id="name" class="bg-inherit border-2 rounded-sm p-1" type="text">
        <span class="text-red-500 text-sm -mt-2" id="name-error" role="alert"></span>
        <label for="amount">Amount:</label>
        <input id="amount" class="bg-inherit border-2 rounded-sm p-1" type="number" step="0.01">
        <span class="text-red-500 text-sm -mt-2" id="amount-error" role="alert"></span>
        <label for="category">Category:</label>
        <input id="category" type="text" list="categories" class="bg-inherit border-2 rounded-sm p-1" />
        <datalist id="categories">
        </datalist>
        <span class="text-red-500 text-sm -mt-2" id="category-error" role="alert"></span>
        <button id="add-transaction" class="py-1 my-4 rounded-sm outline outline-2" type="submit">
          Add Transaction
        </button>
      </form>
    </div>
    <div class="outline outline-2 rounded-sm p-2">
      <div class="flex flex-row items-center justify-between">
        <h2 class="p-2"> Transactions</h2>
        <div>
          Sort:
          <button id="sort-category" class="text-xs rounded-sm p-1 outline outline-2" type="button">By Category</button>
          <button id="sort-amount" class="text-xs rounded-sm p-1 outline outline-2" type="button">By Amount</button>
        </div>
      </div>
      <ul id="transaction-list" class="text-sm flex flex-col gap-y-2"></ul>
    </div>
    <div class="outline outline-2 rounded-sm p-2">
      <h2 class="p-2">Spending by Category</h2>
      <div class="relative h-72 max-w-lg mx-auto">
        <canvas id="spending-chart" role="img" aria-label="Transaction spending distribution by category"></canvas>
      </div>
      <p id="chart-empty" class="py-8 text-center text-sm opacity-75">No transactions to chart.</p>
    </div>
  </main>
  <script src="app.js"></script>
</body>

</html>
